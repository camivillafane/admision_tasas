<mat-toolbar color="primary">
  <span class="spacer">Municipalidad de Concordia - Tasas Eventuales</span>
  <span class="user">{{ authService.currentUser()?.nombre }}</span>
  <button mat-icon-button (click)="logout()" title="Cerrar sesión">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/contribuyentes" routerLinkActive="active">
        <mat-icon matListItemIcon>people</mat-icon>
        <span>Contribuyentes</span>
      </a>
      <a mat-list-item routerLink="/conceptos" routerLinkActive="active">
        <mat-icon matListItemIcon>label</mat-icon>
        <span>Conceptos</span>
      </a>
      <a mat-list-item routerLink="/liquidaciones" routerLinkActive="active">
        <mat-icon matListItemIcon>receipt</mat-icon>
        <span>Liquidaciones</span>
      </a>
      <a mat-list-item routerLink="/pagos" routerLinkActive="active">
        <mat-icon matListItemIcon>payment</mat-icon>
        <span>Pagos</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
