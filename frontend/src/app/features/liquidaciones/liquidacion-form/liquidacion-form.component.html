<h1>Nueva liquidacion</h1>

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="card">
    <h3 class="card-title">Datos generales</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Contribuyente</label>
        <select class="form-control" formControlName="contribuyente_id">
          <option value="">Seleccionar...</option>
          <option *ngFor="let c of contribuyentes()" [value]="c.id">
            {{ c.apellido }}, {{ c.nombre }} ({{ c.cuit }})
          </option>
        </select>
      </div>
      <div class="form-group">
        <label>Tipo de evento</label>
        <input class="form-control" formControlName="tipo_evento" placeholder="Ej: Habilitacion comercial" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Fecha del evento</label>
        <input class="form-control" type="date" formControlName="fecha_evento" />
      </div>
      <div class="form-group">
        <label>Fecha de vencimiento</label>
        <input class="form-control" type="date" formControlName="fecha_vencimiento" />
      </div>
    </div>
  </div>

  <div class="card">
    <h3 class="card-title">Detalles</h3>

    <div formArrayName="detalles">
      <div *ngFor="let detalle of detalles.controls; let i = index" [formGroupName]="i" class="detalle-row">
        <div class="form-group flex-2">
          <label>Concepto</label>
          <select class="form-control" formControlName="concepto_id">
            <option value="">Seleccionar...</option>
            <option *ngFor="let c of conceptos()" [value]="c.id">
              {{ c.codigo }} - {{ c.descripcion }}
              {{ c.es_porcentaje ? '(' + c.valor + '%)' : '($' + c.valor + ')' }}
            </option>
          </select>
        </div>
        <div class="form-group" style="flex:0 1 100px">
          <label>Cantidad</label>
          <input class="form-control" type="number" formControlName="cantidad" />
        </div>
        <div class="form-group" *ngIf="getConcepto(detalle.get('concepto_id')?.value)?.es_porcentaje" style="flex:0 1 130px">
          <label>Base imponible</label>
          <input class="form-control" type="number" formControlName="base_imponible" />
        </div>
        <div class="form-group" style="flex:0 1 130px">
          <label>Monto manual</label>
          <input class="form-control" type="number" formControlName="monto" placeholder="Opcional" />
        </div>
        <button type="button" class="btn-icon danger detalle-del" (click)="removeDetalle(i)">
          <i class="material-icons">delete</i>
        </button>
      </div>
    </div>

    <button type="button" class="btn btn-outline mt-8" (click)="addDetalle()">
      Agregar concepto
    </button>

    <hr class="divider" />

    <div class="total-row">
      <span class="total-label">Total estimado:</span>
      <span class="total-value">${{ total() | number: '1.2-2' }}</span>
    </div>
  </div>

  <div class="flex justify-end gap-12 mt-16">
    <a routerLink="/liquidaciones" class="btn btn-ghost">Cancelar</a>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading">
      Guardar liquidacion
    </button>
  </div>
</form>
