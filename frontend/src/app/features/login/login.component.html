<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Municipalidad de Concordia</mat-card-title>
      <mat-card-subtitle>Sistema de Tasas Eventuales</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="login()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" placeholder="admin" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="••••••••"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <div *ngIf="error" class="error">{{ error }}</div>

        <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loading">
          Ingresar
        </button>

        <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
      </form>
    </mat-card-content>
  </mat-card>
</div>
