<div class="login-container">
  <div class="login-logo">
    <img src="https://www.concordia.gob.ar/sites/default/files/logo-muni.png" alt="Municipalidad de Concordia" />
  </div>
  <p class="login-system">Sistema de Tasas Eventuales</p>

  <div class="login-card">
    <h1 class="login-title">Registrarse</h1>

    <form [formGroup]="form" (ngSubmit)="register()">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <div class="input-icon">
          <i class="material-icons">badge</i>
          <input id="nombre" class="form-control" formControlName="nombre" placeholder="Juan Perez" />
        </div>
      </div>

      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-icon">
          <i class="material-icons">person</i>
          <input id="username" class="form-control" formControlName="username" placeholder="jperez" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contrasena</label>
        <div class="input-icon">
          <i class="material-icons">lock</i>
          <input id="password" class="form-control" type="password" formControlName="password" placeholder="Minimo 6 caracteres" />
        </div>
      </div>

      <div *ngIf="error" class="login-error">{{ error }}</div>

      <button type="submit" class="btn btn-primary w-full btn-login" [disabled]="loading || form.invalid">
        Registrarse
      </button>

      <div *ngIf="loading" class="login-loading">
        <div class="spinner"></div>
      </div>
    </form>

    <p class="login-link">Ya tenes cuenta? <a routerLink="/login">Iniciar sesion</a></p>
  </div>
</div>
